cases:
  # DEV — includes the original smoke scenario and metadata sanity checks.
  - case_id: c001
    split: dev
    case_type: experiential_conflict
    product_ids: [6733478, 6283256]
    query: "برای پوست چرب کدام گزینه مناسب‌تر است؟ از نظر حس روی پوست و تجربه‌ی جوش یا سنگینی هم مقایسه کن."
    notes: "Conflict-sensitive smoke scenario; disagreement in reviews should not be hidden."

  - case_id: c002
    split: dev
    case_type: metadata_deterministic
    product_ids: [6733478, 6283256]
    query: "فقط بر اساس قیمت فعلی، کدام ضد آفتاب ارزان‌تر است؟ درباره تجربه کاربری حدس نزن."
    winner_rule: lower_price

  - case_id: c003
    split: dev
    case_type: experiential
    product_ids: [3832629, 471187]
    query: "این دو شامپو ضد ریزش سریتا را از نظر تجربه کاربران، خشک نکردن مو و رضایت از استفاده مقایسه کن."

  - case_id: c004
    split: dev
    case_type: metadata_deterministic
    product_ids: [76105, 78098]
    query: "فقط با تکیه بر امتیاز ثبت‌شده در متادیتا بگو کدام مرطوب‌کننده امتیاز بالاتری دارد؛ اگر مساوی‌اند برنده اعلام نکن."
    winner_rule: higher_rating

  - case_id: c005
    split: dev
    case_type: experiential
    product_ids: [3383776, 506914]
    query: "برای موی چرب این دو شامپوی ضد شوره را از نظر تجربه کاربران، خشکی مو و رضایت کلی مقایسه کن."

  # TEST — held out from the original smoke-test design.
  - case_id: c006
    split: test
    case_type: experiential
    product_ids: [11398256, 1968567]
    query: "برای پوست چرب این دو ضد آفتاب را از نظر حس روی پوست، چربی یا سنگینی و رضایت کاربران مقایسه کن."

  - case_id: c007
    split: test
    case_type: experiential
    product_ids: [9585339, 3347106]
    query: "این دو آبرسان را از نظر سبک بودن، سرعت جذب و حس چسبندگی بر اساس تجربه کاربران مقایسه کن."

  - case_id: c008
    split: test
    case_type: experiential_negative
    product_ids: [4545846, 708283]
    query: "برای پوست چرب کدام آبرسان تجربه بهتری دارد؟ مخصوصاً سبک بودن و ایجاد نکردن حس چسبندگی یا چربی را مقایسه کن."

  - case_id: c009
    split: test
    case_type: experiential_negative
    product_ids: [2951131, 2234434]
    query: "این دو شامپو را از نظر خشک نکردن مو و تجربه کلی کاربران مقایسه کن و فقط اگر شواهد کافی است یکی را ترجیح بده."

  - case_id: c010
    split: test
    case_type: experiential_negative
    product_ids: [20401, 508883]
    query: "این دو ماشین اصلاح را از نظر نرمی اصلاح، سوزش یا اذیت پوست و رضایت کاربران مقایسه کن."

  - case_id: c011
    split: test
    case_type: three_way_experiential
    product_ids: [11286406, 5536401, 1968567]
    query: "این سه ضد آفتاب مناسب پوست چرب را از نظر تجربه جوش، چربی یا سنگینی و رضایت کاربران مقایسه کن. اگر برای معیاری شاهد نیست، صریح بگو."

  - case_id: c012
    split: test
    case_type: three_way_experiential
    product_ids: [76105, 76496, 708587]
    query: "این سه مرطوب‌کننده پوست خشک را از نظر حس روی پوست، رفع خشکی و رضایت کاربران مقایسه کن و در صورت نبود شاهد برنده نساز."

  - case_id: c013
    split: test
    case_type: metadata_deterministic
    product_ids: [12565742, 6283256]
    query: "فقط بر اساس قیمت فعلی، کدام ضد آفتاب ژیناژن ارزان‌تر است؟ از نظرات برای حدس درباره قیمت استفاده نکن."
    winner_rule: lower_price

  - case_id: c014
    split: test
    case_type: metadata_deterministic
    product_ids: [11398256, 6733478]
    query: "فقط بر اساس امتیاز متادیتا بگو کدام ضد آفتاب امتیاز بالاتری دارد؛ در صورت تساوی برنده اعلام نکن."
    winner_rule: higher_rating

  - case_id: c015
    split: test
    case_type: insufficient_evidence
    product_ids: [9284669, 10621003]
    query: "کدام‌یک از این دو آبرسان تا عمق ۱۰ متر ضدآب است و برای شنا مناسب‌تر است؟ فقط از اطلاعات ارائه‌شده نتیجه بگیر."
    expect_no_winner: true
    notes: "Stress-test for unsupported criteria and calibrated refusal/unknown handling."
