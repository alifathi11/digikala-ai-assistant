      query: سرم مو ضد وز بدون چرب کردن مو
comparison:
  min_products: 2
  max_products: 3
  reviews_per_product: 3
  max_context_chars: 18000
  max_chars_per_review: 900
  evaluation:
    weights:
      correctness: 0.2
      groundedness: 0.2
      criterion_coverage: 0.15
      conflict_handling: 0.1
      recommendation_calibration: 0.15
      relevance: 0.1
      instruction_following: 0.05
      safety: 0.05
    report_split: test
    judge:
      model: gpt-5.6-terra
      max_context_chars: 18000
      max_chars_per_review: 900
    cases:
    - case_id: c001
      split: dev
      case_type: experiential_conflict
      product_ids:
      - 6733478
      - 6283256
      query: برای پوست چرب کدام گزینه مناسب‌تر است؟ از نظر حس روی پوست و تجربه‌ی جوش یا سنگینی هم مقایسه کن.
      notes: Conflict-sensitive smoke scenario; disagreement in reviews should not be hidden.
    - case_id: c002
      split: dev
      case_type: metadata_deterministic
      product_ids:
      - 6733478
      - 6283256
      query: فقط بر اساس قیمت فعلی، کدام ضد آفتاب ارزان‌تر است؟ درباره تجربه کاربری حدس نزن.
      winner_rule: lower_price
    - case_id: c003
      split: dev
      case_type: experiential
      product_ids:
      - 3832629
      - 471187
      query: این دو شامپو ضد ریزش سریتا را از نظر تجربه کاربران، خشک نکردن مو و رضایت از استفاده مقایسه کن.
    - case_id: c004
      split: dev
      case_type: metadata_deterministic
      product_ids:
      - 76105
      - 78098
      query: فقط با تکیه بر امتیاز ثبت‌شده در متادیتا بگو کدام مرطوب‌کننده امتیاز بالاتری دارد؛ اگر مساوی‌اند برنده
        اعلام نکن.
      winner_rule: higher_rating
    - case_id: c005
      split: dev
      case_type: experiential
      product_ids:
      - 3383776
      - 506914
      query: برای موی چرب این دو شامپوی ضد شوره را از نظر تجربه کاربران، خشکی مو و رضایت کلی مقایسه کن.
    - case_id: c006
      split: test
      case_type: experiential
      product_ids:
      - 11398256
      - 1968567
      query: برای پوست چرب این دو ضد آفتاب را از نظر حس روی پوست، چربی یا سنگینی و رضایت کاربران مقایسه کن.
    - case_id: c007
      split: test
      case_type: experiential
      product_ids:
      - 9585339
      - 3347106
      query: این دو آبرسان را از نظر سبک بودن، سرعت جذب و حس چسبندگی بر اساس تجربه کاربران مقایسه کن.
    - case_id: c008
      split: test
      case_type: experiential_negative
      product_ids:
      - 4545846
      - 708283
      query: برای پوست چرب کدام آبرسان تجربه بهتری دارد؟ مخصوصاً سبک بودن و ایجاد نکردن حس چسبندگی یا چربی را مقایسه
        کن.
    - case_id: c009
      split: test
      case_type: experiential_negative
      product_ids:
      - 2951131
      - 2234434
      query: این دو شامپو را از نظر خشک نکردن مو و تجربه کلی کاربران مقایسه کن و فقط اگر شواهد کافی است یکی را ترجیح
        بده.
    - case_id: c010
      split: test
      case_type: experiential_negative
      product_ids:
      - 20401
      - 508883
      query: این دو ماشین اصلاح را از نظر نرمی اصلاح، سوزش یا اذیت پوست و رضایت کاربران مقایسه کن.
    - case_id: c011
      split: test
      case_type: three_way_experiential
      product_ids:
      - 11286406
      - 5536401
      - 1968567
      query: این سه ضد آفتاب مناسب پوست چرب را از نظر تجربه جوش، چربی یا سنگینی و رضایت کاربران مقایسه کن. اگر برای
        معیاری شاهد نیست، صریح بگو.
    - case_id: c012
      split: test
      case_type: three_way_experiential
      product_ids:
      - 76105
      - 76496
      - 708587
      query: این سه مرطوب‌کننده پوست خشک را از نظر حس روی پوست، رفع خشکی و رضایت کاربران مقایسه کن و در صورت نبود
        شاهد برنده نساز.
    - case_id: c013
      split: test
      case_type: metadata_deterministic
      product_ids:
      - 12565742
      - 6283256
      query: فقط بر اساس قیمت فعلی، کدام ضد آفتاب ژیناژن ارزان‌تر است؟ از نظرات برای حدس درباره قیمت استفاده نکن.
      winner_rule: lower_price
    - case_id: c014
      split: test
      case_type: metadata_deterministic
      product_ids:
      - 11398256
      - 6733478
      query: فقط بر اساس امتیاز متادیتا بگو کدام ضد آفتاب امتیاز بالاتری دارد؛ در صورت تساوی برنده اعلام نکن.
      winner_rule: higher_rating
    - case_id: c015
      split: test
      case_type: insufficient_evidence
      product_ids:
      - 9284669
      - 10621003
      query: کدام‌یک از این دو آبرسان تا عمق ۱۰ متر ضدآب است و برای شنا مناسب‌تر است؟ فقط از اطلاعات ارائه‌شده نتیجه
        بگیر.
      expect_no_winner: true
      notes: Stress-test for unsupported criteria and calibrated refusal/unknown handling.
analytics:
  data:
    products_path: data/processed/products_search.parquet
    comments_path: data/processed/comments_clean.parquet
  audit:
    ready_coverage: 0.7
    limited_coverage: 0.3
    minimum_comment_join_rate: 0.95
    product_rating_max: 100
    review_cap_min_products: 20
    generic_brand_values:
    - متفرقه
    - Unknown
    - نامشخص
    unknown_category_values:
    - Unknown
    - نامشخص
  aggregation:
    default_top_n: 10
    min_rating_count_for_leaders: 10
    product_rating_max: 100
    exclude_generic_brands_by_default: true
  manager_qa:
    top_n: 5
    brand_usable_coverage: 0.441082
    product_rating_coverage: 0.380649
    historical_price_enabled: false
    review_volume_ranking_enabled: false
  evaluation:
    weights:
      correctness: 0.25
      groundedness: 0.2
      caveat_compliance: 0.2
      completeness: 0.15
      relevance: 0.1
      managerial_usefulness: 0.05
      instruction_following: 0.05
    output:
      directory: data/evaluation/analytics
      checkpoint: analytics_checkpoint.jsonl
      case_results: analytics_case_results.csv
      metrics: analytics_metrics.parquet
      manual_review: analytics_manual_review.csv
      report: analytics_report.json
    judge:
      model: gpt-5.6-terra
    cases:
    - case_id: a001
      split: dev
      case_type: category_overview
      filters:
        Category2: دفتر
      question: وضعیت کلی دسته دفتر را از نظر اندازه کاتالوگ، قیمت، پوشش بازخورد و امتیازدهی برای مدیر خلاصه کن.
      policy_expectations:
      - rating_coverage_caveat
      notes: General single-category overview.
    - case_id: a002
      split: dev
      case_type: price_analysis
      filters:
        Category2: دفتر
      question: از نظر قیمت فعلی، میانه و بازه میانی قیمت دفترها چه تصویری به مدیر می‌دهد؟
      policy_expectations: []
      notes: Current price only; no historical-price inference.
    - case_id: a003
      split: dev
      case_type: category_comparison
      comparison_categories:
      - دفتر
      - زیورآلات زنانه و مردانه
      category_field: Category2
      question: دفتر و زیورآلات زنانه و مردانه را از نظر قیمت، پوشش بازخورد، امتیاز و تعداد امتیاز ثبت‌شده مقایسه
        کن.
      policy_expectations:
      - rating_coverage_caveat
      notes: Two-way comparison with several deterministic metrics.
    - case_id: a004
      split: dev
      case_type: brand_policy
      filters:
        Category2: دفتر
      question: کدام برندها در دسته دفتر غالب‌اند و سهم بازار هر کدام چقدر است؟
      policy_expectations:
      - brand_coverage_caveat
      notes: 'Adversarial wording: product share in catalog must not be called market share.'
    - case_id: a005
      split: dev
      case_type: historical_price_refusal
      filters:
        Category2: دفتر
      question: قیمت دفترها نسبت به ماه قبل چقدر تغییر کرده و روند قیمت چه بوده است؟
      policy_expectations:
      - historical_price_refusal
      notes: Historical price must be refused because audit coverage is insufficient.
    - case_id: a006
      split: test
      case_type: rating_analysis
      filters:
        Category2: دفتر
      question: کیفیت امتیازدهی محصولات دفتر چطور است و چقدر می‌شود به این عدد تعمیم داد؟
      policy_expectations:
      - rating_coverage_caveat
      notes: Must distinguish score from rating coverage.
    - case_id: a007
      split: test
      case_type: review_coverage
      filters:
        Category2: رنگ مو
      question: پوشش بازخورد کاربران در دسته رنگ مو چقدر است و برای تحلیل مدیریتی چه برداشتی می‌شود داشت؟
      policy_expectations: []
      notes: High review-coverage category.
    - case_id: a008
      split: test
      case_type: insufficient_review_data
      filters:
        Category2: گردنبند طلا زنانه
      question: از تجربه کاربران درباره دسته گردنبند طلا زنانه چه نتیجه‌ای می‌توان برای مدیر گرفت؟
      policy_expectations:
      - zero_review_awareness
      notes: Real audit showed zero review coverage in the available corpus.
    - case_id: a009
      split: test
      case_type: category_comparison
      comparison_categories:
      - دفتر
      - لباس دخترانه
      category_field: Category2
      question: دفتر و لباس دخترانه را از نظر اندازه دسته، میانه قیمت، پوشش بازخورد و امتیاز وزنی مقایسه کن.
      policy_expectations:
      - rating_coverage_caveat
      notes: Tests comparison direction across large price difference.
    - case_id: a010
      split: test
      case_type: category_comparison
      comparison_categories:
      - رنگ مو
      - تجهیزات کمپینگ
      category_field: Category2
      question: رنگ مو و تجهیزات کمپینگ را از نظر پوشش بازخورد، امتیاز و تعداد امتیاز ثبت‌شده مقایسه کن.
      policy_expectations:
      - rating_coverage_caveat
      notes: Comparison emphasizing engagement and review coverage.
    - case_id: a011
      split: test
      case_type: review_volume_policy
      filters:
        Category2: دفتر
      question: پربازخوردترین محصولات دفتر از نظر تعداد review واقعی بازار کدام‌اند؟
      policy_expectations:
      - review_volume_guard
      notes: Must not use corpus review_count as true market-wide popularity.
    - case_id: a012
      split: test
      case_type: brand_policy
      filters:
        Category2: دفتر
      question: برندهای دسته دفتر را بر اساس سهم بازار رتبه‌بندی کن و بگو کدام برند رهبر بازار است.
      policy_expectations:
      - brand_coverage_caveat
      notes: Must reject market-share interpretation and qualify limited brand coverage.
    - case_id: a013
      split: test
      case_type: category1_overview
      filters:
        Category1: لباس زنانه
      question: برای مدیر یک نمای کلی از دسته لباس زنانه شامل اندازه کاتالوگ، قیمت، پوشش بازخورد و امتیازدهی ارائه
        کن.
      policy_expectations:
      - rating_coverage_caveat
      notes: Tests Category1 filtering.
    - case_id: a014
      split: test
      case_type: catalog_overview
      filters: {}
      question: در سطح کل کاتالوگ، اندازه، قیمت، پوشش بازخورد و وضعیت امتیازدهی را به شکل مدیریتی خلاصه کن.
      policy_expectations:
      - brand_coverage_caveat
      - rating_coverage_caveat
      notes: Global scope.
    - case_id: a015
      split: test
      case_type: three_way_comparison
      comparison_categories:
      - دفتر
      - زیورآلات زنانه و مردانه
      - لباس دخترانه
      category_field: Category2
      question: این سه دسته را از نظر تعداد محصول، میانه قیمت، پوشش بازخورد، امتیاز وزنی و تعداد امتیاز ثبت‌شده
        مقایسه کن و تفاوت‌های مهم را بگو.
      policy_expectations:
      - rating_coverage_caveat
      notes: Three-way comparison stress test.
