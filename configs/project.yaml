models:
  gpt-5.6-terra:
    input_cost_per_million: 1.0
    output_cost_per_million: 6.0
  gpt-5.6-sol:
    input_cost_per_million: 5.0
    output_cost_per_million: 30.0
retrieval:
  type: hybrid
  top_k: 5
  hybrid:
    bm25_weight: 0.3
    embedding_weight: 0.7
embedding:
  provider: sentence_transformer
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
generation:
  provider: openai_compatible
  model: gpt-5.6-terra
qa:
  top_k: 8
  max_context_chars: 10000
  max_chars_per_comment: 1500
qa_evaluation:
  evaluation:
    sample_size: 30
    one_query_per_product: true
    random_state: 42
    resume: false
  judge:
    model: gpt-5.6-sol
    max_context_chars: 12000
    max_chars_per_comment: 1500
  weights:
    correctness: 0.25
    relevance: 0.15
    completeness: 0.15
    groundedness: 0.25
    instruction_following: 0.15
    safety: 0.05
product_search:
  metadata:
    bm25_weight: 0.5
    embedding_weight: 0.5
    candidate_multiplier: 4
    lexical_weight: 0.4
    rrf_k: 60
    brand_boost: 0.2
    validate_index_alignment: true
  candidates:
    metadata_products: 50
    review_comments_per_product: 2
    reranker_products: 12
  reranker:
    enabled: true
    metadata_weight: 0.3
    llm_weight: 0.7
    max_reviews_per_product: 2
    max_review_chars: 700
  indexing:
    dense_chunk_size: 10000
    dense_encode_batch_size: 128
    sparse_batch_size: 50000
    sparse_writer_heap_size: 128000000
    sparse_num_threads: 1
  evaluation:
    seed: 42
    test_fraction: 0.25
    qrel_pool:
      hybrid_k: 12
      dense_k: 4
      sparse_k: 4
      rescue_k: 8
      rescue_fragment_k: 3
      rescue_max_fragments: 8
    metadata_k: 50
    reranker_k: 12
    relevant_grade_threshold: 2
    metrics_ks:
    - 1
    - 3
    - 5
    - 10
    allow_teacher_proxy: true
    qrel_judge:
      model: gpt-5.6-terra
      max_reviews_per_product: 1
      max_review_chars: 450
    policies:
    - name: metadata_only
      kind: metadata
    - name: llm_only
      kind: llm_only
      reranker_k: 12
    - name: weighted_20_80
      kind: weighted
      metadata_weight: 0.2
      llm_weight: 0.8
      reranker_k: 12
    - name: weighted_30_70
      kind: weighted
      metadata_weight: 0.3
      llm_weight: 0.7
      reranker_k: 12
    - name: weighted_40_60
      kind: weighted
      metadata_weight: 0.4
      llm_weight: 0.6
      reranker_k: 12
    - name: weighted_50_50
      kind: weighted
      metadata_weight: 0.5
      llm_weight: 0.5
      reranker_k: 12
    - name: tiered_30_70
      kind: llm_tiered
      metadata_weight: 0.3
      llm_weight: 0.7
      reranker_k: 12
    production_policy: tiered_30_70
    queries:
    - query_id: q001
      query_type: brand
      query: شامپو ضد ریزش سریتا
    - query_id: q002
      query_type: brand
      query: ضد آفتاب ژیناژن مناسب پوست چرب
    - query_id: q003
      query_type: brand
      query: کرم آبرسان سیمپل
    - query_id: q004
      query_type: brand
      query: پاوربانک شیائومی 20000
    - query_id: q005
      query_type: brand
      query: هندزفری بی سیم انکر
    - query_id: q006
      query_type: brand
      query: ماشین اصلاح فیلیپس
    - query_id: q007
      query_type: attribute
      query: ضد آفتاب بی رنگ SPF50 برای پوست چرب
    - query_id: q008
      query_type: attribute
      query: شامپو ضد شوره برای موهای چرب
    - query_id: q009
      query_type: attribute
      query: سرخ کن بدون روغن با ظرفیت حداقل 6 لیتر
    - query_id: q010
      query_type: attribute
      query: ماوس بی سیم ارگونومیک
    - query_id: q011
      query_type: attribute
      query: کوله لپ تاپ 15.6 اینچ ضد آب
    - query_id: q012
      query_type: attribute
      query: کرم مرطوب کننده مناسب پوست خشک
    - query_id: q013
      query_type: experiential
      query: کرم آبرسان سبک و زود جذب
    - query_id: q014
      query_type: experiential
      query: هدفون راحت برای استفاده طولانی
    - query_id: q015
      query_type: experiential
      query: جارو شارژی سبک با مکش خوب
    - query_id: q016
      query_type: experiential
      query: اسپیکر با صدای شفاف و بیس خوب
    - query_id: q017
      query_type: experiential
      query: کفش راحت برای پیاده روی طولانی
    - query_id: q018
      query_type: experiential
      query: عطر با ماندگاری خوب و بوی ملایم
    - query_id: q019
      query_type: negative
      query: ضد آفتاب پوست چرب که جوش نزنه
    - query_id: q020
      query_type: negative
      query: شامپو که مو رو خشک نکنه
    - query_id: q021
