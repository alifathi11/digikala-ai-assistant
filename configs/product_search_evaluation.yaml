product_search_evaluation:
  seed: 42
  test_fraction: 0.25

  qrel_pool:
    hybrid_k: 12
    dense_k: 4
    sparse_k: 4

    # Evaluation-only recall rescue; production retrieval is unchanged.
    rescue_k: 8
    rescue_fragment_k: 3
    rescue_max_fragments: 8

  metadata_k: 50
  reranker_k: 12
  relevant_grade_threshold: 2
  metrics_ks: [1, 3, 5, 10]

  # Preliminary mode. For final reporting, manually review at least all TEST rows.
  allow_teacher_proxy: true

  qrel_judge:
    model: null
    input_cost_per_million: null
    output_cost_per_million: null
    max_reviews_per_product: 1
    max_review_chars: 450

  policies:
    - {name: metadata_only, kind: metadata}
    - {name: llm_only, kind: llm_only, reranker_k: 12}
    - {name: weighted_20_80, kind: weighted, metadata_weight: 0.20, llm_weight: 0.80, reranker_k: 12}
    - {name: weighted_30_70, kind: weighted, metadata_weight: 0.30, llm_weight: 0.70, reranker_k: 12}
    - {name: weighted_40_60, kind: weighted, metadata_weight: 0.40, llm_weight: 0.60, reranker_k: 12}
    - {name: weighted_50_50, kind: weighted, metadata_weight: 0.50, llm_weight: 0.50, reranker_k: 12}
    - {name: tiered_30_70, kind: llm_tiered, metadata_weight: 0.30, llm_weight: 0.70, reranker_k: 12}
