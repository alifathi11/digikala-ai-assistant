evaluation:
  sample_size: 30
  one_query_per_product: true
  random_state: 42
  resume: true

judge:
  # Keep separate from the QA model so a different judge can be used later.
  model: gpt-5.6-sol
  max_context_chars: 12000
  max_chars_per_comment: 1500

  # Fill these with your provider's exact judge-model pricing if known.
  input_cost_per_million: null
  output_cost_per_million: null

weights:
  correctness: 0.25
  relevance: 0.15
  completeness: 0.15
  groundedness: 0.25
  instruction_following: 0.15
  safety: 0.05
